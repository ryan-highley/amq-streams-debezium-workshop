
replicaCount: 1

image:
  repository: mcr.microsoft.com/mssql/server
  pullPolicy: IfNotPresent
  tag: 2025-latest

env:
  - name: MSSQL_DATA_DIR
    value: /opt/mssql-data
  - name: MSSQL_LOG_DIR
    value: /opt/mssql-log
  - name: MSSQL_PID
    value: Developer
  - name: ACCEPT_EULA
    value: Y
  - name: MSSQL_SA_PASSWORD
    value: P@ssW0rdY

ports:
  - name: mssql
    containerPort: 1433
    protocol: TCP

service:
  type: ClusterIP

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  limits:
    cpu: 250m
    memory: 2Gi
  requests:
    cpu: 20m
    memory: 512Mi

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

volumes:
  - name: mssql-data-dir
    persistentVolumeClaim:
      claimName: mssql-data-dir
      size: 5Gi

volumeMounts:
  - name: mssql-data-dir
    mountPath: /opt/mssql-data

nodeSelector: {}

tolerations: []

affinity: {}
