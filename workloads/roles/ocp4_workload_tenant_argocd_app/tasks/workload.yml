---
# -------------------------------------------------------------------------
# Install Tenant ArgoCD App - Based on ocp4_workload_field_content
# -------------------------------------------------------------------------

- name: Validate ArgoCD App content repository URL is provided
  ansible.builtin.fail:
    msg: "ocp4_workload_tenant_argocd_app_gitops_repo_url is required but not provided"
  when: ocp4_workload_tenant_argocd_app_gitops_repo_url == "" or ocp4_workload_tenant_argocd_app_gitops_repo_url is not defined

- name: Read all agnosticd_user_data
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_argocd_app_user_data: "{{ lookup('agnosticd.core.agnosticd_user_data', '*') }}"

- name: Set deployer values (always included)
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_argocd_app_deployer_values:
      deployer:
        domain: "{{ openshift_cluster_ingress_domain }}"
        apiUrl: "{{ openshift_api_url }}"
      gitops:
        repoURL: "{{ ocp4_workload_tenant_argocd_app_gitops_repo_url }}"
        revision: "{{ ocp4_workload_tenant_argocd_app_gitops_repo_revision }}"
        path: "{{ ocp4_workload_tenant_argocd_app_gitops_repo_path }}"
      app:
        name: "{{ ocp4_workload_tenant_argocd_app_name }}"
        namespace: "{{ ocp4_workload_tenant_argocd_app_namespace }}"
        project: "{{ ocp4_workload_tenant_argocd_app_project_name }}"
        destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_destination_namespace }}"

- name: Combine all Helm values
  ansible.builtin.set_fact:
    _ocp4_workload_tenant_argocd_app_all_values: >-
      {{
        ocp4_workload_tenant_argocd_app_helm_values | default({})
        | combine(_ocp4_workload_tenant_argocd_app_deployer_values)
        | combine(_ocp4_workload_tenant_argocd_app_user_data)
      }}

- name: Debug final Helm values
  ansible.builtin.debug:
    msg: "{{ _ocp4_workload_tenant_argocd_app_all_values | to_yaml }}"

- name: Add user account to ArgoCD CR
  kubernetes.core.k8s:
    api_version: argoproj.io/v1beta1
    kind: ArgoCD
    namespace: openshift-gitops
    name: openshift-gitops
    state: patched
    definition:
      spec:
        extraConfig: "{{ {'accounts.' ~ ocp4_workload_tenant_argocd_app_user: 'apiKey, login'} }}"

- name: Create ArgoCD AppProject for {{ ocp4_workload_tenant_argocd_app_user }}
  kubernetes.core.k8s:
    state: present
    template: appproject-user.yaml.j2

- name: Create ArgoCD Application for {{ ocp4_workload_tenant_argocd_app_user }}
  kubernetes.core.k8s:
    state: present
    template: application.yaml.j2

- name: Verify ArgoCD Application was accepted
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ ocp4_workload_tenant_argocd_app_name }}"
    namespace: "{{ ocp4_workload_tenant_argocd_app_namespace }}"
  register: argocd_app_result
  retries: 6
  delay: 10
  until:
    - argocd_app_result.resources | length > 0
  failed_when: argocd_app_result.resources | length == 0

- name: Save AgnosticD user data
  agnosticd.core.agnosticd_user_info:
    data:
      openshift_gitops_server: "{{ ocp4_workload_tenant_argocd_app_gitops_repo_url }}"
      openshift_gitops_user: "{{ ocp4_workload_tenant_argocd_app_user }}"
      openshift_gitops_appproject: "{{ ocp4_workload_tenant_argocd_app_project_name }}"
