---
# -------------------------------------------------------------------------
# Install Red Hat Streams for Apache Kafka Console Operator
# -------------------------------------------------------------------------

- name: Setting up workload for user
  when: not ocp4_workload_kafka_console_silent | bool
  ansible.builtin.debug:
    msg: "Setting up Streams for Apache Kafka Console workload"

- name: Install Streams for Apache Kafka Console operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: amq-streams-console
    install_operator_namespace: "{{ ocp4_workload_kafka_console_operator_namespace }}"
    install_operator_channel: "{{ ocp4_workload_kafka_console_channel }}"
    install_operator_csv_nameprefix: amq-streams-console
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: "{{ ocp4_workload_kafka_console_automatic_install_plan_approval | default(true) }}"
    install_operator_starting_csv: "{{ ocp4_workload_kafka_console_starting_csv }}"
    install_operator_catalogsource_setup: "{{ ocp4_workload_kafka_console_use_catalog_snapshot | default(false) }}"
    install_operator_catalogsource_name: "{{ ocp4_workload_kafka_console_catalogsource_name | default('') }}"
    install_operator_catalogsource_namespace: "{{ ocp4_workload_kafka_console_operator_namespace }}"
    install_operator_catalogsource_image: "{{ ocp4_workload_kafka_console_catalog_snapshot_image | default('') }}"
    install_operator_catalogsource_image_tag: "{{ ocp4_workload_kafka_console_catalog_snapshot_image_tag | default('') }}"

- name: Workload tasks complete
  when: not ocp4_workload_kafka_console_silent | bool
  ansible.builtin.debug:
    msg: "Streams for Apache Kafka Console operator installed successfully."
