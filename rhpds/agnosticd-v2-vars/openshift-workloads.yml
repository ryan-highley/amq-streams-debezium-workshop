---
# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
# ===================================================================
# End Mandatory Variables
# ===================================================================

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12

# ===================================================================
# List of clusters with credentials. Credentials come from secrets
# or from Babylon
# ===================================================================
clusters:
- default:
    api_url: "{{ cluster2.sandbox_openshift_api_url }}"
    api_token: "{{ cluster2.sandbox_openshift_api_token }}"

# ===================================================================
# List of workloads to apply to clusters with cluster selector
# ===================================================================

workloads:
- agnosticd.core_workloads.ocp4_workload_authentication_htpasswd
- agnosticd.core_workloads.ocp4_workload_cert_manager
- agnosticd.core_workloads.ocp4_workload_amq_streams
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.showroom.ocp4_workload_showroom_user_data_seed
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.showroom.ocp4_workload_showroom

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_authentication_htpasswd
# -------------------------------------------------------------------
ocp4_workload_authentication_htpasswd_user_count: 3
ocp4_workload_authentication_htpasswd_user_password_randomized: true
ocp4_workload_authentication_htpasswd_admin_user: rhadmin

# -------------------------------------------------------------------
# Workload: ocp4_workload_cert_manager
# -------------------------------------------------------------------
ocp4_workload_cert_manager_channel: stable-v1

ocp4_workload_cert_manager_use_catalog_snapshot: false

ocp4_workload_cert_manager_install_ingress_certificates: true
ocp4_workload_cert_manager_install_api_certificates: false

# -------------------------------------------------------------------
# Workload: ocp4_workload_amq_streams
# -------------------------------------------------------------------
ocp4_workload_amq_streams_operator_namespace: openshift-operators
ocp4_workload_amq_streams_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom_user_data_seed
# -------------------------------------------------------------------
ocp4_workload_showroom_user_data_seed:
  openshift_console_url: https://console-openshift-console.{{ openshift_cluster_ingress_domain }}
  kafka_console_url: https://kafka-console-showroom-{{ user }}.{{ openshift_cluster_ingress_domain }}
  users:
    user1:
      env: {}
    user2:
      env: {}
    user3:
      env: {}

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/ryan-highley/amq-streams-debezium-workshop.git
ocp4_workload_showroom_content_git_repo_ref: bcbs-sc-training

ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_content_ui_config: |
  type: showroom

  # Set the left column width to 40%
  default_width: 40
  # Persist the URL state so browser refresh doesn't reset the UI
  persist_url_state: true

  view_switcher:
    enabled: true
    default_mode: split

  tabs:
    # OCP Console
    - name: OCP Console
      url: {{ openshift_console_url }}

    # Single terminal
    - name: Terminal
      path: /terminal
      port: 443

    # Kafka Console
    - name: Kafka Console
      url: {{ kafka_console_url }}

    # External page
    - name: Red Hat Documentation
      url: 'https://docs.redhat.com/en/documentation'
