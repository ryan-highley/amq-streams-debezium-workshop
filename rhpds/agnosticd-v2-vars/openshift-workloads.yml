# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso
ocp4_workload_tenant_keycloak_user_username: "user"
ocp4_workload_tenant_keycloak_user_password: "dbztrain26"
# ocp4_workload_tenant_keycloak_username: "{{ lookup('agnosticd.core.agnosticd_user_data', 'username') }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"
# ocp4_workload_tenant_namespace_username: "user-{{ ocp4_workload_tenant_keycloak_username }}"

ocp4_workload_tenant_namespace_suffixes:
  # - suffix: tenant-comm-debezium
  - suffix: tenant-comm-kafka
  - suffix: showroom
    limit_range:
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
  - suffix: dev
  # - suffix: db

ocp4_workload_tenant_namespace_default_quota:
  limits.cpu: "4"
  requests.cpu: "4"
  limits.memory: 12Gi
  requests.memory: 12Gi
  requests.storage: 50Gi

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_argocd_app
# -------------------------------------------------------------------
ocp4_workload_tenant_argocd_app_user: "{{ ocp4_workload_tenant_keycloak_username }}"

ocp4_workload_tenant_argocd_app_gitops_repo_url: "{{ workshop_gitops_repo_url }}"
ocp4_workload_tenant_argocd_app_gitops_repo_revision: "{{ workshop_gitops_repo_revision }}"
ocp4_workload_tenant_argocd_app_gitops_repo_path: "deployments/app-of-apps"

ocp4_workload_tenant_argocd_app_project_name: "{{ ocp4_workload_tenant_argocd_app_user_project_prefix }}-{{ ocp4_workload_tenant_argocd_app_user }}"
# ocp4_workload_tenant_argocd_app_project_namespace: openshift-gitops  # <-- Default
ocp4_workload_tenant_argocd_app_user_cluster_resource_whitelist:
  - group: console.openshift.io
    kind: ConsoleLink

ocp4_workload_tenant_argocd_app_name: "{{ ocp4_workload_tenant_argocd_app_user }}-app-config"
# ocp4_workload_tenant_argocd_app_namespace: openshift-gitops   # <-- Default
ocp4_workload_tenant_argocd_app_destination_namespace: "{{ ocp4_workload_tenant_argocd_app_namespace }}"  # <-- App of Apps in same namespace

ocp4_workload_tenant_argocd_app_deploy_namespace_base: "{{ ocp4_workload_tenant_namespace_username }}"

ocp4_workload_tenant_argocd_app_helm_values:
  namespace: "{{ ocp4_workload_tenant_argocd_app_destination_namespace }}"
  project: "{{ ocp4_workload_tenant_argocd_app_project_name }}"

  applications:
    - name: "{{ ocp4_workload_tenant_argocd_app_user }}-kafka"
      repoURL: "{{ workshop_gitops_repo_url }}"
      revision: "{{ workshop_gitops_repo_revision }}"
      path: deployments/kafka
      chartName: kafka
      destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-tenant-comm-kafka"
      values:
        kafka:
          image: registry.redhat.io/amq-streams/kafka-42-rhel9:3.2.0
          localcluster:
            namespace: "{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-tenant-comm-kafka"
          nodepool:
            broker:
              cpu:
                request: 20m
                limits: 250m
            controller:
              cpu:
                request: 20m
                limits: 250m

    # - name: "{{ ocp4_workload_tenant_argocd_app_user }}-mssql-db"
