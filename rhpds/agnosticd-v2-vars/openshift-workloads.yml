    #   revision: "{{ workshop_gitops_repo_revision }}"
    #   path: deployments/tekton-pipeline
    #   chartName: tekton-pipeline
    #   destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-dev"
    #   values:
    #     global:
    #       namespace: "{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-dev"
    #       imageTag: latest
    #       imageRegistry: image-registry.openshift-image-registry.svc:5000/{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-dev/
    #       appName: "{{ ocp4_workload_tenant_argocd_app_user }}-tenant-comm-debezium"
    #     git:
    #       url: "git@gitlab.gitlab.svc:2222:{{ ocp4_workload_tenant_argocd_app_user }}/ocp_btds_debezium.git"
    #       revision: "feature/test"
    #       githubwebookenabled: false
    #       image: "registry.redhat.io/openshift-builds/openshift-builds-git-cloner-rhel9:1.8.1"
    #     helm:
    #       image: "quay.io/redhat-cop/tekton-task-helm:latest"
    #     maven:
    #       image: "registry.redhat.io/amq-streams/maven-builder-rhel9:3.2.0"
    #       resources:
    #         requests:
    #           cpu: "100m"
    #           memory: "256Mi"
    #         limits:
    #           cpu: "250m"
    #           memory: "1Gi"

    - name: "{{ ocp4_workload_tenant_argocd_app_user }}-miscellaneous"
      repoURL: "{{ workshop_gitops_repo_url }}"
      revision: "{{ workshop_gitops_repo_revision }}"
      path: deployments/miscellaneous
      chartName: miscellaneous
      destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-dev"
      values:
        consolelinks:
          - name: "{{ ocp4_workload_tenant_argocd_app_user }}-showroom"
            spec:
              href: https://showroom-{{ ocp4_workload_tenant_argocd_app_deploy_namespace_base }}-showroom.{{ openshift_cluster_ingress_domain }}
              text: Red Hat Workshop
              location: NamespaceDashboard
              namespaceDashboard:
                namespaces:
                  - "{{ ocp4_workload_tenant_argocd_app_user }}-dev"
                  - "{{ ocp4_workload_tenant_argocd_app_user }}-db"
                  - "{{ ocp4_workload_tenant_argocd_app_user }}-tenant-comm-debezium"
                  - "{{ ocp4_workload_tenant_argocd_app_user }}-tenant-comm-kafka"
                  - "{{ ocp4_workload_tenant_argocd_app_user }}-showroom"

# -------------------------------------------------------------------
# Workload: ocp4_workload_gitlab
# -------------------------------------------------------------------
ocp4_workload_gitlab_volume_size: 20Gi
ocp4_workload_gitlab_postgresql_volume_size: 10Gi
ocp4_workload_gitlab_auth_mode: keycloak
ocp4_workload_gitlab_user_default_access_levels: ["developer","maintainer"]

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_gitlab
# -------------------------------------------------------------------
ocp4_workload_tenant_gitlab_auth_mode: "{{ ocp4_workload_gitlab_auth_mode }}"
ocp4_workload_tenant_gitlab_username: "{{ ocp4_workload_tenant_keycloak_username }}"

# -------------------------------------------------------------------
# Workload: ocp4_workload_amq_streams
# -------------------------------------------------------------------
ocp4_workload_amq_streams_operator_namespace: openshift-operators
ocp4_workload_amq_streams_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/ryan-highley/amq-streams-debezium-showroom.git
ocp4_workload_showroom_content_git_repo_ref: bcbs-sc-training

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"

ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_passthrough_user_data: true

ocp4_workload_showroom_enable_dev_mode: true
ocp4_workload_showroom_terminal_requests_cpu: 50m
ocp4_workload_showroom_terminal_requests_memory: 256Mi
ocp4_workload_showroom_terminal_limits_cpu: 150m
ocp4_workload_showroom_terminal_limits_memory: 256Mi

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_content_ui_config: |
  type: showroom

  # Set the left column width to 40%
  default_width: 40
  # Persist the URL state so browser refresh doesn't reset the UI
  persist_url_state: true

  view_switcher:
    enabled: true
    default_mode: split

  tabs:
    # OCP Console
    - name: OCP Console
      url: {{ openshift_console_url }}

    # Stacked terminals
    - name: Terminal
      path: /terminal
      port: 443
      secondary_name: Terminal
      secondary_path: /terminal
      secondary_port: 443

    # Kafka Console
    # - name: Kafka Console
    #   url: https://kafka-console-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

    # External page
    - name: Red Hat Documentation
      url: 'https://docs.redhat.com/en/documentation'
