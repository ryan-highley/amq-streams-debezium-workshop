---
# ===================================================================
# Mandatory Variables
# ===================================================================
# Repository Tag
# Tag for all repositories that are used in this config.
# ===================================================================
tag: main
# -------------------------------------------------------------------
cloud_provider: none
config: openshift-workloads
# ===================================================================
# End Mandatory Variables
# ===================================================================

workshop_gitops_repo_url: https://github.com/ryan-highley/amq-streams-debezium-workshop.git
workshop_gitops_repo_revision: bcbs-sc-training

# ===================================================================
# Additional Collections & roles to be installed for this config
# ===================================================================
requirements_content:
  collections:
  # Core OpenShift Workloads
  - name: https://github.com/rhpds/core_workloads.git
    type: git
    version: "{{ tag }}"
  # Namespaced OpenShift Workloads
  - name: https://github.com/rhpds/namespaced_workloads.git
    type: git
    version: "{{ tag }}"
  # RHPDS Showroom Workloads
  - name: https://github.com/rhpds/showroom.git
    type: git
    version: v1.6.12
  # Workshop Workloads
  - name: "{{ workshop_gitops_repo_url }}"
    type: git
    version: "{{ workshop_gitops_repo_revision }}"

# ===================================================================
# List of clusters with credentials. Credentials come from secrets
# or from Babylon
# ===================================================================
clusters:
- default:
    api_url: "{{ sandbox_openshift_api_url }}"
    api_token: "{{ sandbox_openshift_api_token }}"

# ===================================================================
# List of workloads to apply to clusters with cluster selector
# ===================================================================

workloads:
- agnosticd.core_workloads.ocp4_workload_amq_streams
- agnosticd.core_workloads.ocp4_workload_openshift_gitops
- agnosticd.core_workloads.ocp4_workload_pipelines
- workshop.workloads.ocp4_workload_kafka_console
- agnosticd.showroom.ocp4_workload_ocp_console_embed
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

num_users: 3

tenant_workloads:
- agnosticd.namespaced_workloads.ocp4_workload_tenant_keycloak_user
- agnosticd.namespaced_workloads.ocp4_workload_tenant_namespace
- workshop.workloads.ocp4_workload_tenant_argocd_app
- agnosticd.showroom.ocp4_workload_showroom

remove_workloads:
- agnosticd.core_workloads.ocp4_workload_multi_tenant_loop

# ===================================================================
# Variables for specific workloads
# ===================================================================

# -------------------------------------------------------------------
# Workload: ocp4_workload_multi_tenant_loop
# -------------------------------------------------------------------
tenant_user_info_data:
  lab_ui_url: https://showroom-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  kafka_console_ingress_domain: kafka-console-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  kafka_console_url: https://kafka-console-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}
  kafka_cluster_bootstrap_domain: "btds-kafkacluster-kafka-bootstrap.{{ ocp4_workload_tenant_keycloak_username }}-tenant-comm-kafka.svc"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_keycloak_user
# -------------------------------------------------------------------
ocp4_workload_tenant_keycloak_user_keycloak_realm: sso
ocp4_workload_tenant_keycloak_user_username: "user"
ocp4_workload_tenant_keycloak_user_password: "dbztrain26"

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_namespace
# -------------------------------------------------------------------
ocp4_workload_tenant_namespace_username: "{{ ocp4_workload_tenant_keycloak_username }}"

ocp4_workload_tenant_namespace_suffixes:
  - suffix: tenant-comm-debezium
  - suffix: tenant-comm-kafka
  - suffix: dev
  - suffix: db

# -------------------------------------------------------------------
# Workload: ocp4_workload_tenant_argocd_app
# -------------------------------------------------------------------
ocp4_workload_tenant_argocd_app_user: "{{ ocp4_workload_tenant_keycloak_username }}"
ocp4_workload_tenant_argocd_app_gitops_repo_url: "{{ workshop_gitops_repo_url }}"
ocp4_workload_tenant_argocd_app_gitops_repo_revision: "{{ workshop_gitops_repo_revision }}"
ocp4_workload_tenant_argocd_app_gitops_repo_path: "argocd/app-of-apps"
ocp4_workload_tenant_argocd_app_project_name: "{{ ocp4_workload_tenant_argocd_app_user_project_prefix }}-{{ ocp4_workload_tenant_argocd_app_user }}"
ocp4_workload_tenant_argocd_app_user_cluster_resource_whitelist: []
ocp4_workload_tenant_argocd_app_name: "{{ ocp4_workload_tenant_argocd_app_user }}-app-config"
ocp4_workload_tenant_argocd_app_namespace: "{{ ocp4_workload_tenant_argocd_app_user }}-dev"
ocp4_workload_tenant_argocd_app_destination_namespace: "{{ ocp4_workload_tenant_argocd_app_namespace }}"

ocp4_workload_tenant_argocd_app_helm_values:
  namespace: "{{ ocp4_workload_tenant_argocd_app_destination_namespace }}"
  project: "{{ ocp4_workload_tenant_argocd_app_project_name }}"

  applications:
    - name: "{{ ocp4_workload_tenant_argocd_app_user }}-kafka"
      repoURL: "{{ workshop_gitops_repo_url }}"
      revision: "{{ workshop_gitops_repo_revision }}"
      path: helm/kafka
      chartName: kafka
      destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_user }}-tenant-comm-kafka"
      values:
        kafka:
          image: registry.redhat.io/amq-streams/kafka-42-rhel9:3.2.0
          localcluster:
            namespace: "{{ ocp4_workload_tenant_argocd_app_user }}-tenant-comm-kafka"

    - name: "{{ ocp4_workload_tenant_argocd_app_user }}-tekton-pipeline"
      repoURL: "{{ workshop_gitops_repo_url }}"
      revision: "{{ workshop_gitops_repo_revision }}"
      path: helm/tekton-pipeline
      chartName: tekton-pipeline
      destinationNamespace: "{{ ocp4_workload_tenant_argocd_app_user }}-dev"
      values:
        global:
          namespace: "{{ ocp4_workload_tenant_argocd_app_user }}-dev"

# -------------------------------------------------------------------
# Workload: ocp4_workload_amq_streams
# -------------------------------------------------------------------
ocp4_workload_amq_streams_operator_namespace: openshift-operators
ocp4_workload_amq_streams_channel: stable

# -------------------------------------------------------------------
# Workload: ocp4_workload_showroom
# -------------------------------------------------------------------
ocp4_workload_showroom_content_git_repo: https://github.com/ryan-highley/amq-streams-debezium-showroom.git
ocp4_workload_showroom_content_git_repo_ref: bcbs-sc-training

ocp4_workload_showroom_namespace: "{{ ocp4_workload_tenant_keycloak_username }}-showroom"

ocp4_workload_showroom_content_antora_playbook: site.yml

ocp4_workload_showroom_content_only: false

ocp4_workload_showroom_passthrough_user_data: true

ocp4_workload_showroom_terminal_type: showroom
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:latest
ocp4_workload_showroom_content_ui_config: |
  type: showroom

  # Set the left column width to 40%
  default_width: 40
  # Persist the URL state so browser refresh doesn't reset the UI
  persist_url_state: true

  view_switcher:
    enabled: true
    default_mode: split

  tabs:
    # OCP Console
    - name: OCP Console
      url: {{ openshift_console_url }}

    # Single terminal
    - name: Terminal
      path: /terminal
      port: 443

    # Kafka Console
    - name: Kafka Console
      url: https://kafka-console-{{ ocp4_workload_tenant_keycloak_username }}-showroom.{{ openshift_cluster_ingress_domain }}

    # External page
    - name: Red Hat Documentation
      url: 'https://docs.redhat.com/en/documentation'
